services:
  db:
    image: pgvector/pgvector:pg16-trixie
    container_name: pgvector-db

    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data

  paper-agent:
    build: .
    container_name: paper-agent-frontend
    ports: 
      - "7860:7860"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
    depends_on:
      - db

volumes:
  pgvector-data:


    